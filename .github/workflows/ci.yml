# Build the Blazor app + SampleExcelGen on every push/PR. Run manually from the Actions tab anytime.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore CuttingParameterVerifier.sln

      - name: Build
        run: dotnet build CuttingParameterVerifier.sln --configuration Release --no-restore
