# -----------------------------------------------------------------------------
# CI — build and verify the solution on every push and pull request.
#
# This workflow does NOT deploy. Delivery to hosting is handled separately so:
#   • Pull requests and forks do not need FTP secrets.
#   • Builds stay fast and easy to read in the Actions tab.
#
# Automatic FTP deploy to MonsterASP: see deploy-monsterasp.yml
# -----------------------------------------------------------------------------

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore CuttingParameterVerifier.sln

      - name: Build (Release)
        run: dotnet build CuttingParameterVerifier.sln --configuration Release --no-restore

      # Publishing catches Razor/static asset and publish-profile issues that `build` alone can miss.
      - name: Publish web app (verify)
        run: >-
          dotnet publish CuttingParameterVerifier/CuttingParameterVerifier.csproj
          --configuration Release
          --no-build
          --output ./publish-verify

      - name: Show publish output (first files)
        run: ls -la ./publish-verify | head -n 30
