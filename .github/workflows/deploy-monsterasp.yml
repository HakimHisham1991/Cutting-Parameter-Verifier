# =============================================================================
# Full CI/CD — this repository’s only GitHub Actions workflow (MonsterASP FTP)
# =============================================================================
#
# CI — every push & pull request
#   Restore → Release build → dotnet publish (Razor / static assets validated).
#
# CD — not on pull_request
#   • Push to `main` on the canonical repo (not a fork) → FTP upload
#   • Manual: Actions → run workflow → optional Dry run / Dangerous clean slate
#
# Secrets (Settings → Secrets and variables → Actions)
#   MONSTERASP_FTP_SERVER       Hostname only, no ftp://
#   MONSTERASP_FTP_USERNAME
#   MONSTERASP_FTP_PASSWORD
#   MONSTERASP_FTP_SERVER_DIR   Optional; defaults to /wwwroot/ if unset
#
# Variables (optional)
#   MONSTERASP_FTP_PROTOCOL     e.g. ftps
#   MONSTERASP_FTP_PORT         e.g. 21 or 990
#
# Stale live site: wrong MONSTERASP_FTP_SERVER_DIR, cache, or another deploy
# (e.g. MonsterASP GitHub pull) overwriting files — use one deploy method.
#
# FTP 550 / "Could not access file" / "GetHandle" on .dll: the site is still
# running and has the DLL open. This workflow uploads app_offline.htm first so
# ASP.NET Core stops, waits, syncs publish output, then removes app_offline.htm.
# =============================================================================

name: MonsterASP CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dangerous_clean_slate:
        description: >
          Delete ALL files in the remote deployment folder before upload.
          Use once if the live site shows stale UI; leave off for normal deploys.
        required: false
        type: boolean
        default: false
      dry_run:
        description: >
          Log what would change on the server without uploading (safe connectivity test).
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore CuttingParameterVerifier.sln

      - name: Build (Release)
        run: dotnet build CuttingParameterVerifier.sln --configuration Release --no-restore

      - name: Publish web app (verify)
        run: >-
          dotnet publish CuttingParameterVerifier/CuttingParameterVerifier.csproj
          --configuration Release
          --no-build
          --output ./publish

      - name: Show publish output (first files)
        run: ls -la ./publish | head -n 30

      - name: Upload publish folder for MonsterASP deploy
        if: >
          github.event.repository.fork == false &&
          github.event_name != 'pull_request' &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
          )
        uses: actions/upload-artifact@v4
        with:
          name: published-webapp
          path: publish/
          retention-days: 2

  deploy-monsterasp:
    name: Deploy to MonsterASP (FTP)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      needs.build.result == 'success' &&
      github.event.repository.fork == false &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Download publish folder
        uses: actions/download-artifact@v4
        with:
          name: published-webapp
          path: publish

      - name: Check required FTP secrets
        env:
          MONSTERASP_FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          MONSTERASP_FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          MONSTERASP_FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          set -e
          missing=0
          if [ -z "${MONSTERASP_FTP_SERVER:-}" ]; then
            echo '::error::Missing secret MONSTERASP_FTP_SERVER. Add it under Settings → Secrets and variables → Actions.'
            missing=1
          fi
          if [ -z "${MONSTERASP_FTP_USERNAME:-}" ]; then
            echo '::error::Missing secret MONSTERASP_FTP_USERNAME.'
            missing=1
          fi
          if [ -z "${MONSTERASP_FTP_PASSWORD:-}" ]; then
            echo '::error::Missing secret MONSTERASP_FTP_PASSWORD.'
            missing=1
          fi
          exit "$missing"

      - name: Compute remote deployment folder
        id: remote_dir
        env:
          RAW: ${{ secrets.MONSTERASP_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          dir="${RAW:-/wwwroot/}"
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          echo "Using server-dir: $dir"
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          set -euo pipefail
          echo "::notice::Commit ${GITHUB_SHA} — uploading $(du -sh publish | cut -f1) to MonsterASP"

      # Stops the worker process so .dll files are not locked during overwrite.
      - name: Create app_offline.htm (local)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p offline
          printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Deploying</title></head><body><p>Deploying update…</p></body></html>' > offline/app_offline.htm

      - name: Upload app_offline.htm (stop site / release DLL locks)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          local-dir: ./offline/
          server-dir: ${{ steps.remote_dir.outputs.path }}
          protocol: ${{ vars.MONSTERASP_FTP_PROTOCOL != '' && vars.MONSTERASP_FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.MONSTERASP_FTP_PORT != '' && vars.MONSTERASP_FTP_PORT || 21 }}
          state-name: offline/.ftp-offline-state.json
          timeout: 120000
          log-level: verbose

      - name: Wait for app to stop
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: sleep 20

      - name: Upload site (FTP sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ steps.remote_dir.outputs.path }}
          protocol: ${{ vars.MONSTERASP_FTP_PROTOCOL != '' && vars.MONSTERASP_FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.MONSTERASP_FTP_PORT != '' && vars.MONSTERASP_FTP_PORT || 21 }}
          timeout: 120000
          log-level: verbose
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dangerous_clean_slate == 'true' }}
          # Keep app_offline.htm until the dedicated cleanup step (avoid site restarting mid-sync).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app_offline.htm

      - name: Remove app_offline.htm (bring site back)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          FTP_SERVER: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ steps.remote_dir.outputs.path }}
          FTP_PORT: ${{ vars.MONSTERASP_FTP_PORT != '' && vars.MONSTERASP_FTP_PORT || 21 }}
          FTP_PROTOCOL: ${{ vars.MONSTERASP_FTP_PROTOCOL != '' && vars.MONSTERASP_FTP_PROTOCOL || 'ftp' }}
        run: |
          python << 'PY'
          import os
          import sys
          from ftplib import FTP, FTP_TLS

          server = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          port = int(os.environ.get("FTP_PORT") or "21")
          protocol = (os.environ.get("FTP_PROTOCOL") or "ftp").lower().strip()
          remote = (os.environ.get("FTP_REMOTE_DIR") or "/wwwroot/").replace("\\", "/")

          def connect():
              if protocol == "ftps":
                  ftp = FTP_TLS()
                  ftp.connect(server, port, timeout=120)
                  ftp.login(user, password)
                  ftp.prot_p()
                  return ftp
              ftp = FTP()
              ftp.connect(server, port, timeout=120)
              ftp.login(user, password)
              return ftp

          def cwd_segments(ftp, path):
              for part in path.split("/"):
                  if part:
                      ftp.cwd(part)

          try:
              ftp = connect()
              cwd_segments(ftp, remote)
              try:
                  ftp.delete("app_offline.htm")
                  print("Removed app_offline.htm — site should be live.")
              except Exception as e:
                  print(f'::warning::Could not delete app_offline.htm ({e}). Remove it manually in {remote} if the site stays in "offline" mode.')
              ftp.quit()
          except Exception as e:
              print(f'::warning::FTP cleanup failed ({e}). If the site shows the offline page, delete app_offline.htm via FileZilla.')
              sys.exit(0)
          PY
